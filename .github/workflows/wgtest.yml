name: wgtest

on: workflow_dispatch

jobs:
  tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools iperf3

      - name: Join hive
        env:
          KEY: ${{ secrets.WGTEST_KEY }}
          PEER: ${{ secrets.WGTEST_PEER }}
          ENDPOINT: ${{ secrets.WGTEST_ENDPOINT }}
        run: |
          sudo ip link add wgtest type wireguard
          sudo ip addr add 10.77.0.2/24 dev wgtest
          echo "$KEY" | sudo wg set wgtest private-key /dev/stdin peer "$PEER" \
            endpoint "$ENDPOINT" allowed-ips 10.77.0.0/24,10.231.1.2/32 persistent-keepalive 25
          sudo ip link set wgtest mtu 1412 up
          sudo ip route add 10.231.1.2/32 dev wgtest

      - name: Reach hive
        run: ping -c 5 -W 3 10.77.0.1

      - name: Reach the cache
        run: curl -fsS --max-time 15 http://10.231.1.2:8080/bresilla/nix-cache-info

      - name: Upload 150 MB
        run: iperf3 -c 10.77.0.1 -n 150M

      - name: Handshake
        if: always()
        run: sudo wg show wgtest latest-handshakes
